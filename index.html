<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3> ≽^• ˕ • ྀི≼</title>

  <link rel="icon" type="image/png" href="favicon.jpg">

  <!-- خط ProFile Views -->
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      overflow: hidden;
    }

    .background-image {
      background-image: url('٢٠٢٥٠٧١١_١١٢٩٠٢.gif');
      background-size: cover;
      background-position: center;
      height: 200px;
    }

    .profile-section {
      padding: 20px;
      text-align: center;
    }

    .profile-picture-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto;
      margin-top: -50px;
    }

    .profile-picture {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #000;
      background-color: #000;
    }

    .profile-decoration {
      position: absolute;
      top: -10px;
      left: 50%;
      width: 120%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    h2 {
      margin: 10px 0 5px;
      font-size: 1.5em;
    }

    .username {
      color: #aaa;
      margin-bottom: 15px;
    }

    .social-links {
      display: flex;
      justify-content: center;
    }

    .social-links a {
      margin: 0 10px;
    }

    .social-links img {
      width: 30px;
      height: 30px;
    }

    .music-box {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 70px;
      height: 70px;
      border: 3px solid white;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      z-index: 100;
      background-color: #111;
    }

    .music-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-list {
      position: absolute;
      top: 90px;
      left: 10px;
      background-color: #111;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      width: 250px;
      z-index: 99;
      padding: 5px;
      border: 3px solid;
      animation: rgb-border 3s linear infinite;
    }

    @keyframes rgb-border {
      0% { border-color: red; }
      33% { border-color: lime; }
      66% { border-color: blue; }
      100% { border-color: red; }
    }

    .song-list.show {
      display: flex;
    }

    .song {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }

    .song-info img {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-controls button {
      background: none;
      border: none;
      font-size: 15px;
      cursor: pointer;
      color: white;
      outline: none;
      padding: 0;
    }

    .song-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .song-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .song-time {
      color: #888;
      font-size: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 5px;
      background-color: #222;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #6481E3;
    }

    .corner-icon {
      position: fixed;
      bottom: 15px;
      right: 15px;
      width: 45px;
      height: 45px;
      border-radius: 10px;
      cursor: pointer;
      z-index: 999;
    }

    .corner-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50px;
    }

    #viewCounterBox {
      position: fixed;
      bottom: 20px;
      left: 15px;
      background: #111;
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      z-index: 9999;
      border: 1px solid #333;
    }

    .view-number {
      font-size: 17px;
      color: white;
      font-weight: bold;
    }

    #profileViewsCard {
      position: fixed;
      bottom: 75px;
      left: 15px;
      width: 160px;
      padding: 12px;
      border-radius: 14px;
      background: #121212;
      border: 2px solid #2b2b2b;
      color: white;
      font-family: 'Comic Neue', sans-serif;
      text-align: center;
      opacity: 0;
      transform: scale(0.6) translateY(20px);
      pointer-events: none;
      transition: 0.22s ease;
      z-index: 9999;
    }

    #profileViewsCard.active {
      opacity: 1;
      transform: scale(1) translateY(0px);
      pointer-events: auto;
    }

    .profileTitle {
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="background-image"></div>

    <div class="profile-section">
      <div class="profile-picture-wrapper">
        <img src="profile.jpg" class="profile-picture">
        <img src="cat-ears.gif" class="profile-decoration">
      </div>

      <h2>Little Dream ↝</h2>
      <p class="username">@o.o.c</p>

      <div class="social-links">
        <a href="https://youtube.com/@r.y6x" target="_blank"><img src="youtube.png"></a>
        <a href="https://www.instagram.com/rody.mooo" target="_blank"><img src="instagram.png"></a>
        <a href="https://discord.com/users/905063235231834203" target="_blank"><img src="discord.png"></a>
      </div>
    </div>
  </div>

  <!-- Profile Views -->
  <div id="viewCounterBox">
      <img class="view-eye" src="view-eye.png">
      <span class="view-number" id="counter">0</span>
  </div>

  <div id="profileViewsCard">
      <div class="profileTitle">ProFile Views</div>
  </div>

  <script>
    /* === زياراتك أنت فقط === */
    let myVisits = localStorage.getItem("myVisits");

    if (!myVisits) {
      myVisits = 1;
    } else {
      myVisits = parseInt(myVisits) + 1;
    }

    localStorage.setItem("myVisits", myVisits);

    document.getElementById("counter").textContent = myVisits;

    const counterBox = document.getElementById("viewCounterBox");
    const card = document.getElementById("profileViewsCard");

    counterBox.addEventListener("click", () => {
      card.classList.toggle("active");
      card.innerHTML = `
        <div class="profileTitle">ProFile Views</div>
        <div style="margin-top:8px;">👤 زياراتك: ${myVisits}</div>
      `;
    });

    card.addEventListener("click", () => {
      card.classList.remove("active");
    });
  </script>

</body>
</html>
